name: Deploy free demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static files
        run: |
          test -s site/index.html
          test -s site/admin.html
          test -s site/product-home.webp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check personalized reports and image saving
        run: |
          node tests/report-upgrade.test.mjs
          node tests/report-save.test.mjs
          node tests/mother-art.test.mjs
          node tests/clear-report.test.mjs
          node tests/share-copy.test.mjs
          node tests/fifteen.test.mjs
          node tests/refinement.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
