async function buyerAPI(route,data,publicRequest=false){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),30000);try{const response=await fetch(BACKEND_API+route,{method:data===undefined?'GET':'POST',headers:{...(data===undefined?{}:{'Content-Type':'application/json'}),...(!publicRequest&&buyerToken?{'X-Mama-Session':buyerToken}:{})},body:data===undefined?undefined:JSON.stringify(data),signal:controller.signal});let result;try{result=await response.json()}catch{throw new Error('测评服务暂时不可用，请稍后再试。')}if(!response.ok){const error=new Error(result.error||'操作未完成，请稍后再试。');error.status=response.status;throw error}return result}finally{clearTimeout(timeout)}}
function showHome(){renderHomeBase();const start=app.querySelector('.primary');start.onclick=()=>showAccess(false);const privacy=app.querySelector('.privacy');privacy.replaceChildren(node('p','','本测评会保存作答、基础信息与测评结果。'),node('p','','开始前请阅读数据说明，无需填写姓名或手机号。'))}
function showAccess(resume=false){resumeAfterAccess=resume;setView('access');header('开始之前');const view=node('div','form-view access-view');view.append(node('h1','','输入测评密码'),node('p','description','每个密码可完成3次测评，成功保存结果后才扣除一次。'));const form=node('form',''),label=node('label','','测评密码');label.htmlFor='access-code';const input=node('input','access-code');input.id='access-code';input.type='password';input.autocomplete='off';input.maxLength=64;input.placeholder=buyerToken?'已验证，可直接继续或输入新密码':'请输入测评密码';const text=node('p','data-notice','本测评会将你的答题选项、前置信息和测评结论保存到测评数据库，用于生成报告、查看服务记录和改进问卷，由管理员管理。无需填写姓名、手机号；请勿在补充内容中填写孩子姓名或学校。你主动分享的结果链接可被获得链接的人查看。');const consent=node('label','consent-line'),checkbox=node('input','');checkbox.type='checkbox';checkbox.checked=dataConsent;checkbox.onchange=()=>dataConsent=checkbox.checked;consent.append(checkbox,node('span','','我已阅读并同意上述答题数据保存说明。'));const notice=node('p','notice');notice.setAttribute('aria-live','polite');const nav=node('div','nav'),go=button('下一页','primary',()=>{});go.type='submit';nav.append(go,button('返回上一页','',()=>resume?render():showHome()));form.append(label,input,text,consent,notice,nav);form.onsubmit=async event=>{event.preventDefault();if(!checkbox.checked){notice.textContent='请先阅读并勾选数据保存说明。';return}if(!input.value.trim()&&!buyerToken){notice.textContent='请输入测评密码。';input.focus();return}go.disabled=true;notice.textContent='正在验证…';try{let result;if(input.value.trim()){result=await buyerAPI('auth',{password:input.value.trim()},true);buyerToken=result.token;attemptToken='';submissionSnapshot=null}else result=await buyerAPI('session');if(result.version!==BACKEND_VERSION)throw new Error('问卷版本已更新，请刷新后再开始。');buyerRemaining=result.remaining;if(buyerRemaining<=0)throw new Error('当前密码的3次测评机会已用完，请更换密码。');dataConsent=true;input.value='';if(resumeAfterAccess)render();else showBasic()}catch(e){notice.textContent=e.name==='AbortError'?'验证超时，请检查网络后重试。':e.message;if(e.status===401)buyerToken=''}finally{go.disabled=false}};view.append(form);app.append(view)}
async function submitAnswers(notice){if(submitBusy)return;if(!buyerToken||!dataConsent){showAccess(true);return}submitBusy=true;app.querySelectorAll('button').forEach(b=>b.disabled=true);notice.textContent=submissionSnapshot?'正在确认提交结果…':'正在保存答卷并生成报告…';try{if(!attemptToken){const attempt=await buyerAPI('start',{});attemptToken=attempt.attempt}if(!submissionSnapshot)submissionSnapshot={attempt:attemptToken,answers:[...answers],profile:{...basicState},context:{belief:[...selections.belief],pain:[...selections.pain],other:otherPain},version:BACKEND_VERSION,consent:true,consentVersion:DATA_CONSENT_VERSION};const result=await buyerAPI('complete',submissionSnapshot);if(!result.report||result.report.version!==BACKEND_VERSION)throw new Error('结果版本异常，请重试确认已保存的结果。');cachedReport=result.report;lastResultId=result.id;buyerRemaining=result.remaining;sharedResult=false;attemptToken='';submissionSnapshot=null;try{history.replaceState(null,'','#result='+lastResultId)}catch{}showReport(0);window.scrollTo(0,0)}catch(e){if(e.status===401||e.status===409){buyerToken='';attemptToken='';submissionSnapshot=null;showAccess(true);const field=app.querySelector('.notice');field.textContent=e.message+' 请重新验证或更换密码，已选答案仍保留。'}else{const uncertain=!e.status||e.status>=500;if(!uncertain){attemptToken='';submissionSnapshot=null}notice.textContent=(e.name==='AbortError'?'请求超时。':e.message)+(uncertain?' 上次提交状态待确认，请点击“查看测评结果”重试取回，避免重复扣次。':'');app.querySelectorAll('button').forEach(b=>b.disabled=uncertain&&!b.classList.contains('primary'))}}finally{submitBusy=false;if(stage==='quiz'&&!submissionSnapshot)app.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function beginEdit(){if(sharedResult){restartAll();return}cachedReport=null;lastResultId='';attemptToken='';submissionSnapshot=null;try{history.replaceState(null,'',location.pathname+location.search)}catch{}current=9;render();window.scrollTo(0,0)}
// Report navigation is handled by the upgraded renderer above.
function restartAll(){cachedReport=null;lastResultId='';sharedResult=false;attemptToken='';submissionSnapshot=null;dataConsent=false;try{history.replaceState(null,'',location.pathname+location.search)}catch{}resetBase()}
async function boot(){const params=new URLSearchParams(location.hash.slice(1));if(params.has('card')){showPublicCard(params.get('card'));return;}const id=params.get('result');if(id){setView('loading');header('正在打开测评结果');try{if(!/^[a-f0-9]{48}$/.test(id))throw new Error('结果链接无效。');const result=await buyerAPI('result/'+id,undefined,true);if(result.report?.version!==BACKEND_VERSION)throw new Error('此链接不是当前问卷的报告。');cachedReport=result.report;lastResultId=id;sharedResult=true;showReport(0)}catch(e){app.append(node('p','notice',e.message));const nav=node('div','nav');nav.append(button('开始我的测评','primary',restartAll));app.append(nav)}}else showHome()}

boot();
</script></body></html>
