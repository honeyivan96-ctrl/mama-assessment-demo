function showReport(pageIndex=0){renderReportBase(pageIndex);const nav=app.querySelector('.nav');if(pageIndex===0&&nav){const edit=nav.children[1];edit.textContent=sharedResult?'开始我的测评':'返回修改答案';edit.onclick=beginEdit}if(pageIndex===2&&nav){wireReportImageSave(nav.children[0],reportInfo(),app.querySelector('.report-status'));const copyLink=button('复制分享链接','',async()=>{const status=app.querySelector('.report-status');if(!lastResultId){status.textContent='请先成功保存本次结果。';return}try{const url=new URL(location.href);url.hash='result='+lastResultId;await copyReportText(url.href);status.textContent='结果链接已复制，接收者无需密码查看报告。'}catch{status.textContent='无法自动复制，请复制浏览器地址栏中的结果链接。'}});nav.insertBefore(copyLink,nav.children[1])}}
function restartAll(){cachedReport=null;lastResultId='';sharedResult=false;attemptToken='';submissionSnapshot=null;dataConsent=false;try{history.replaceState(null,'',location.pathname+location.search)}catch{}resetBase()}
async function boot(){const id=new URLSearchParams(location.hash.slice(1)).get('result');if(id){setView('loading');header('正在打开测评结果');try{if(!/^[a-f0-9]{48}$/.test(id))throw new Error('结果链接无效。');const result=await buyerAPI('result/'+id,undefined,true);if(result.report?.version!==BACKEND_VERSION)throw new Error('此链接不是当前问卷的报告。');cachedReport=result.report;lastResultId=id;sharedResult=true;showReport(0)}catch(e){app.append(node('p','notice',e.message));const nav=node('div','nav');nav.append(button('开始我的测评','primary',restartAll));app.append(nav)}}else showHome()}

boot();
</script></body></html>
