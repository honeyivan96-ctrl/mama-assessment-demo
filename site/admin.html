<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>妈妈测评 · 管理后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#292920;font:14px/1.7 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}.shell{max-width:1180px;margin:auto;padding:28px 24px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:18px 0 10px}.sub,.muted{color:#827b6b}.sub{font-size:12px;margin:5px 0 0}.button{background:#292920;color:#fffdf5;border:1px solid #292920;padding:10px 18px;border-radius:3px;min-height:42px}.secondary{background:transparent;color:#292920;border-color:#cbc5b6}.danger{color:#9d4936}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.card{background:#fffdf7;border:1px solid #dfd8ca;border-radius:5px;padding:22px;margin-bottom:20px}.login{max-width:440px;margin:80px auto}label{display:block;font-weight:500;margin:14px 0 7px}input,select{border:1px solid #d4cdbd;border-radius:3px;padding:11px 12px;background:#fffefa;width:100%;min-height:44px;color:#292920}.login .button{width:100%;margin-top:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}.stats .card{margin:0}.stat{font-size:28px;font-weight:600;margin-top:7px}.tabs{display:flex;gap:28px;border-bottom:1px solid #d8d0bf;margin-bottom:22px}.tabs button{padding:13px 0;background:none;border:0;border-bottom:2px solid transparent;color:#827b6b}.tabs .selected{color:#292920;border-bottom-color:#292920}.form-grid{display:grid;grid-template-columns:140px minmax(180px,1fr) auto;gap:16px;align-items:end}.form-grid label{margin-top:0}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:13px 12px;text-align:left;border-bottom:1px solid #e6dfd1;vertical-align:middle}th{color:#827b6b;font-weight:500;background:#f7f3eb}td .button{font-size:12px;padding:5px 10px;min-height:32px}.pager{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:20px}.pager .actions{flex-wrap:nowrap}.message{min-height:24px;margin:12px 0;color:#8e624a;white-space:pre-line}.badge{display:inline-block;background:#eee7d9;padding:3px 9px;font-size:12px;border-radius:10px}.hidden,[hidden]{display:none!important}.code-list{font:14px/1.8 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f0e5;padding:16px;margin:14px 0}.notice{font-size:12px;line-height:1.9;color:#9a795c}.empty{padding:30px;color:#827b6b;text-align:center}dialog{border:1px solid #d4cdbd;border-radius:6px;width:min(900px,94vw);max-height:90vh;padding:24px;background:#fffdf7;color:#292920}dialog::backdrop{background:#0006}.dialog-top{position:sticky;top:-24px;background:#fffdf7;padding:12px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dfd8ca}.details-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.detail-box{background:#f5f0e6;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}.question{padding:16px 0;border-top:1px solid #dfd8ca}.question p{margin:8px 0;color:#827b6b}.answer-option{font-size:13px;padding:7px 12px;color:#8e8778}.answer-option.chosen{background:#eee6d7;color:#292920;font-weight:500}.dimension{display:flex;justify-content:space-between;border-bottom:1px solid #e6dfd1;padding:10px 0}.report-prose{white-space:pre-wrap;line-height:1.95}.link{color:#69634e}button:focus-visible,input:focus-visible{outline:3px solid #bea578;outline-offset:3px}@media(max-width:650px){.shell{padding:20px 16px}.top{align-items:flex-start}h1{font-size:21px}.stats{gap:8px}.stats .card{padding:14px 10px}.stat{font-size:24px}.form-grid{grid-template-columns:1fr}.card{padding:17px}.details-meta{grid-template-columns:1fr}.pager{flex-wrap:wrap}.login{margin:40px auto}.top .actions{justify-content:flex-end}}
</style></head><body><main class="shell"><header class="top"><div><h1>妈妈测评 · 管理后台</h1><p class="sub">密码管理 / 答题记录 / 测评结论</p></div><div class="actions"><a href="./" class="link" target="_blank" rel="noopener">打开测评</a><button id="logout" class="button secondary" hidden>退出登录</button></div></header>
<section id="login-panel" class="card login"><h2>管理员登录</h2><p class="muted">使用已设置的管理密码。</p><form id="login-form"><label for="admin-password">管理密码</label><input id="admin-password" type="password" autocomplete="current-password" required maxlength="200"><button type="submit" class="button" id="login-button">登录后台</button></form><p id="login-message" class="message" role="status"></p></section>
<div id="dashboard" hidden><section class="stats"><div class="card"><div class="muted">已生成密码</div><div class="stat" id="stat-codes">—</div></div><div class="card"><div class="muted">启用密码</div><div class="stat" id="stat-active">—</div></div><div class="card"><div class="muted">完成测评数</div><div class="stat" id="stat-records">—</div></div></section><nav class="tabs" aria-label="后台功能"><button data-tab="codes" class="selected">测评密码</button><button data-tab="records">问卷与结论</button></nav><div class="actions"><button class="button secondary" id="refresh">刷新数据</button><span class="muted">每个密码可成功完成3次测评</span></div><p id="status" class="message" role="status"></p>
<section id="codes-panel"><div class="card"><h2>生成测评密码</h2><form id="generate-form" class="form-grid"><div><label for="count">生成数量</label><input type="number" min="1" max="100" step="1" value="1" id="count" required></div><div><label for="label">批次备注（选填）</label><input id="label" maxlength="60" placeholder="例如：10月体验用户"></div><button type="submit" class="button" id="generate">生成密码</button></form><p class="notice">密码只在本次生成时显示明文，请立即复制或导出。后台之后只能查看密码尾号。</p><div id="generated" hidden><div class="code-list" id="generated-text"></div><div class="actions"><button class="button secondary" id="copy-codes">复制本批密码</button><button class="button secondary" id="download-codes">导出本批CSV</button></div></div></div><div class="card"><h2>密码记录</h2><div class="table-wrap"><table><thead><tr><th>密码尾号</th><th>批次备注</th><th>使用 / 总次数</th><th>状态</th><th>生成时间</th><th>管理</th></tr></thead><tbody id="codes-body"></tbody></table></div><div class="pager"><span id="codes-page" class="muted"></span><div class="actions"><button class="button secondary" id="codes-prev">上一页</button><button class="button secondary" id="codes-next">下一页</button></div></div></div></section>
<section id="records-panel" hidden><div class="card"><div class="top"><div><h2>问卷与测评结论</h2><span class="muted">查看前置信息、10题选项、五维刻度及完整结论。</span></div><button id="export-records" class="button secondary">导出本页CSV</button></div><div class="table-wrap"><table><thead><tr><th>完成时间</th><th>密码尾号</th><th>批次备注</th><th>孩子</th><th>最终画像</th><th>详情</th></tr></thead><tbody id="records-body"></tbody></table></div><div class="pager"><span id="records-page" class="muted"></span><div class="actions"><button class="button secondary" id="records-prev">上一页</button><button class="button secondary" id="records-next">下一页</button></div></div></div></section></div>
<dialog id="detail"><div class="dialog-top"><h2>问卷与结论详情</h2><button id="close-detail" class="button secondary">关闭</button></div><div id="detail-content"></div></dialog></main>
<script>
const API='https://apqqdkooiezejwyypwht.supabase.co/functions/v1/mama-v2/';let token=sessionStorage.getItem('mamaAdminV2')||'',activeTab='codes',codePage=1,recordPage=1,generated=[],recordRows=[];const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n},formatDate=v=>new Date(v).toLocaleString('zh-CN',{hour12:false}),beliefs=['棍棒底下出孝子','没有规矩不成方圆','学习主要看天赋','提前学，尽早学','尊重兴趣和感受','吃苦与坚持'],pains=['学习表现未达预期','电子产品难控制','交流少，不够亲近','不配合，容易争执','不知管到何种程度','暂时满意，无明显困扰','其他困扰'];
function message(text){$('status').textContent=text}function showLogin(){token='';sessionStorage.removeItem('mamaAdminV2');$('dashboard').hidden=true;$('login-panel').hidden=false;$('logout').hidden=true;$('generated').hidden=true;generated=[];recordRows=[];$('codes-body').replaceChildren();$('records-body').replaceChildren();$('detail-content').replaceChildren();if($('detail').open)$('detail').close()}
async function api(path,data){const response=await fetch(API+path,{method:data===undefined?'GET':'POST',headers:{...(data===undefined?{}:{'Content-Type':'application/json'}),...(token?{'X-Mama-Admin':token}:{})},body:data===undefined?undefined:JSON.stringify(data)});let result;try{result=await response.json()}catch{throw new Error('后台接口暂时不可用，请稍后再试。')}if(!response.ok){if(response.status===401&&path!=='admin/login')showLogin();throw new Error(result.error||'操作未完成。')}return result}
function downloadCSV(name,rows){const quote=value=>{let s=String(value??'');if(/^[\t\r\n ]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'},csv='\uFEFF'+rows.map(row=>row.map(quote).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function copy(text){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text);const a=el('textarea');a.value=text;document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();if(!ok)throw new Error('自动复制未获允许，请手动复制上面的密码。')}
function cell(row,value){row.append(el('td',value))}function empty(body,columns){const tr=el('tr'),td=el('td','暂无记录','empty');td.colSpan=columns;tr.append(td);body.append(tr)}function pager(type,page,total){const pages=Math.max(1,Math.ceil(total/100));$(type+'-page').textContent='第 '+page+' / '+pages+' 页，共 '+total+' 条';$(type+'-prev').disabled=page<=1;$(type+'-next').disabled=page>=pages}
async function loadStats(){const s=await api('admin/stats');$('stat-codes').textContent=s.codes;$('stat-active').textContent=s.activeCodes;$('stat-records').textContent=s.submissions}
async function loadCodes(){const r=await api('admin/codes?page='+codePage),body=$('codes-body');body.replaceChildren();if(!r.codes.length)empty(body,6);r.codes.forEach(c=>{const tr=el('tr');cell(tr,'•••• '+c.hint);cell(tr,c.label||'—');cell(tr,c.used+' / '+c.quota);cell(tr,c.active?'已启用':'已停用');cell(tr,formatDate(c.created));const td=el('td'),b=el('button',c.active?'停用':'启用','button secondary');b.onclick=async()=>{b.disabled=true;try{await api('admin/toggle',{id:c.id,active:c.active?0:1});await refresh();message('密码状态已更新。')}catch(e){message(e.message)}finally{b.disabled=false}};td.append(b);tr.append(td);body.append(tr)});pager('codes',r.page,r.total)}
async function loadRecords(){const r=await api('admin/submissions?page='+recordPage);recordRows=r.items;const body=$('records-body');body.replaceChildren();if(!r.items.length)empty(body,6);r.items.forEach(item=>{const tr=el('tr');cell(tr,formatDate(item.created));cell(tr,'•••• '+(item.code?.hint||''));cell(tr,item.code?.label||'—');cell(tr,(item.profile.sex===0?'男孩':'女孩')+' · '+item.profile.childAge);cell(tr,item.typeName);const td=el('td'),b=el('button','查看','button secondary');b.onclick=()=>detail(item.result_id);td.append(b);tr.append(td);body.append(tr)});pager('records',r.page,r.total)}
async function refresh(){const b=$('refresh');b.disabled=true;message('正在读取数据…');try{await Promise.all([loadStats(),activeTab==='codes'?loadCodes():loadRecords()]);message('')}catch(e){message(e.message)}finally{b.disabled=false}}
function addSection(parent,title,text){parent.append(el('h3',title),el('div',text,'detail-box'))}function names(values,items){return values.map(i=>items[i]).join('；')||'未选择'}
async function detail(id){message('正在读取记录…');try{const r=await api('admin/submissions/'+id),s=r.submission,p=s.profile,c=s.context,report=r.report,container=$('detail-content');container.replaceChildren();const meta=el('div',undefined,'details-meta');meta.append(el('div','时间：'+formatDate(s.created)+'\n密码尾号：'+(r.code.hint||'—')+'\n备注：'+(r.code.label||'—'),'detail-box'),el('div','身份：'+['妈妈','爸爸','其他照护者'][p.role]+'\n家长年龄：'+(p.age||'未填写')+'\n孩子：'+(p.sex===0?'男孩':'女孩')+'，'+p.childAge,'detail-box'));container.append(meta);addSection(container,'育儿观念',names(c.belief,beliefs));addSection(container,'目前困扰',names(c.pain,pains)+(c.other?'\n补充：'+c.other:''));container.append(el('h3','10道题与所选答案'));s.question_snapshot.forEach((q,i)=>{const section=el('section',undefined,'question');section.append(el('strong',String(i+1).padStart(2,'0')+'｜'+q.title));q.options.forEach((text,k)=>section.append(el('div',String(s.answers[i]===k?'✓ ':'  ')+'ABCD'[k]+'. '+text,'answer-option'+(s.answers[i]===k?' chosen':''))));container.append(section)});if(report){addSection(container,'最终画像',report.profile.name+' · '+report.profile.tag);addSection(container,'总体结论',report.profile.quote+'\n\n'+report.profile.body+'\n\n'+report.profile.edge);container.append(el('h3','五维刻度与解读'));report.dimensions.forEach(d=>{const row=el('div',undefined,'dimension');row.append(el('strong',d.name),el('span',d.score===null?'信息不足':d.score));container.append(row,el('p',d.analysis,'muted'))});addSection(container,'结果小结',report.summary);addSection(container,'给妈妈的话',report.profile.closing)}container.append(el('p','问卷版本：'+s.question_version+'；数据保存告知版本：'+s.consent_version,'notice'));$('detail').showModal();message('')}catch(e){message(e.message)}}
$('login-form').onsubmit=async e=>{e.preventDefault();const b=$('login-button');b.disabled=true;$('login-message').textContent='正在登录…';try{const r=await api('admin/login',{password:$('admin-password').value});token=r.token;sessionStorage.setItem('mamaAdminV2',token);$('admin-password').value='';$('login-panel').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false;await refresh();$('login-message').textContent=''}catch(error){$('login-message').textContent=error.message}finally{b.disabled=false}};
$('logout').onclick=async()=>{try{await api('admin/logout',{})}catch{}showLogin()};$('refresh').onclick=refresh;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===b));$('codes-panel').hidden=activeTab!=='codes';$('records-panel').hidden=activeTab!=='records';refresh()});
$('generate-form').onsubmit=async e=>{e.preventDefault();const b=$('generate');b.disabled=true;try{const r=await api('admin/codes',{count:Number($('count').value),label:$('label').value});generated=r.generated;$('generated-text').textContent=generated.map(x=>x.password).join('\n');$('generated').hidden=false;codePage=1;await refresh();message('已生成 '+generated.length+' 个密码，请立即复制或导出。')}catch(error){message(error.message)}finally{b.disabled=false}};
$('copy-codes').onclick=async()=>{try{await copy(generated.map(x=>x.password).join('\n'));message('本批密码已复制。')}catch(e){message(e.message)}};$('download-codes').onclick=()=>downloadCSV('测评密码.csv',[['测评密码','批次备注','可完成次数'],...generated.map(x=>[x.password,x.label,x.quota])]);
$('codes-prev').onclick=()=>{codePage--;refresh()};$('codes-next').onclick=()=>{codePage++;refresh()};$('records-prev').onclick=()=>{recordPage--;refresh()};$('records-next').onclick=()=>{recordPage++;refresh()};$('close-detail').onclick=()=>$('detail').close();
$('export-records').onclick=async()=>{const b=$('export-records');b.disabled=true;try{if(!recordRows.length)throw new Error('本页暂无记录。');const rows=[['记录ID','完成时间','密码尾号','批次备注','身份','家长年龄','孩子性别','孩子年龄','育儿观念','育儿困扰','补充困扰',...Array.from({length:10},(_,i)=>'第'+(i+1)+'题选项'),...Array.from({length:10},(_,i)=>'第'+(i+1)+'题内容'),'最终画像','总体结论','成长提示','结果小结','妈妈寄语','情感回应','规则与跟进','自主支持','沟通与修复','日常连接','问卷版本','告知版本']];for(let i=0;i<recordRows.length;i++){message('正在导出 '+(i+1)+' / '+recordRows.length+' 条…');const r=await api('admin/submissions/'+recordRows[i].result_id),s=r.submission,p=s.profile,c=s.context,report=r.report;rows.push([s.result_id,formatDate(s.created),r.code.hint,r.code.label,['妈妈','爸爸','其他照护者'][p.role],p.age,p.sex===0?'男孩':'女孩',p.childAge,names(c.belief,beliefs),names(c.pain,pains),c.other,...s.answers.map(a=>'ABCD'[a]),...s.answers.map((a,k)=>s.question_snapshot[k].options[a]),report?.profile.name,report?.profile.body,report?.profile.edge,report?.summary,report?.profile.closing,...(report?.dimensions.map(d=>d.score)??Array(5).fill('')),s.question_version,s.consent_version])}downloadCSV('问卷与结论_第'+recordPage+'页.csv',rows);message('本页记录已导出。')}catch(e){message(e.message)}finally{b.disabled=false}};
if(location.protocol==='file:')document.getElementById('login-message').textContent='本地界面预览：数据库和接口部署完成后，才能登录并生成真实密码。';if(token){$('login-panel').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false;refresh()}
</script></body></html>
