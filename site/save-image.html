<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>保存妈妈测评图片</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f7f4ea;color:#35493e;font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}main{max-width:560px;margin:auto;padding:28px 20px 50px}h1{font-size:25px;margin:0 0 12px}p{font-size:15px;line-height:1.9}.button{display:block;width:100%;border:1px solid #587967;border-radius:10px;padding:16px 12px;margin:14px 0;text-align:center;text-decoration:none;background:#587967;color:white;font:17px sans-serif}.secondary{background:transparent;color:#587967}.notice{padding:14px;background:#e9ede1;border-radius:9px}img{display:block;width:100%;height:auto;margin:20px 0}textarea{width:100%;min-height:110px;font-size:14px}#status{color:#815c39}details{margin-top:20px;font-size:14px;line-height:1.9}</style></head><body><main><h1>保存你的妈妈测评图片</h1><p>在手机浏览器里，点击下方按钮下载图片，无需长按。</p><p class="notice" id="guide">若当前页面来自小红书，请先点“用系统浏览器打开”。若没有跳转，复制保存链接，粘贴到手机自带浏览器的地址栏。</p><a id="browser" class="button secondary" hidden>用系统浏览器打开</a><a id="download" class="button" hidden>下载图片到手机</a><button id="copy" class="button secondary" type="button">复制保存链接</button><p id="status" role="status" aria-live="polite"></p><div id="manual"></div><img id="image" alt="待保存的妈妈测评图片" hidden><details><summary>下载后在哪里查看？</summary><p>在浏览器的“下载”或手机“文件管理 → Download（下载）”中查看PNG图片。部分相册会显示“下载”相册，部分手机需要在文件管理中打开图片，再使用“保存／移至相册”。是否自动出现在相册，取决于手机系统与相册设置。</p></details></main><script src="image-save-link.js?v=android2"></script><script>
const p=new URLSearchParams(location.hash.slice(1)),image=p.get('image'),download=p.get('download'),file=p.get('name')||'妈妈测评图片.png',status=document.getElementById('status'),button=document.getElementById('download'),browser=document.getElementById('browser'),img=document.getElementById('image');
if(MamaImageSave.allowed(image)&&MamaImageSave.allowed(download)){
 img.src=image;img.hidden=false;img.onerror=()=>status.textContent='图片链接可能已过期，请回到测评结果页重新准备下载。';button.href=download;button.download=file;button.hidden=false;button.onclick=()=>status.textContent='已请求下载，请查看浏览器的下载通知或“下载”列表。如果仍无反应，请先复制保存链接，用手机自带浏览器打开。';
 if(/Android/i.test(navigator.userAgent)){browser.href=MamaImageSave.intent(location.href);browser.hidden=false;browser.onclick=()=>status.textContent='正在尝试打开系统浏览器。若没有跳转，请复制保存链接，再粘贴到手机自带浏览器的地址栏。';}
}else status.textContent='保存链接不完整或无效，请从测评结果页重新打开。';
document.getElementById('copy').onclick=async()=>{let ok=false;const t=document.createElement('textarea');t.value=location.href;t.readOnly=true;document.getElementById('manual').replaceChildren(t);t.focus();t.select();try{ok=document.execCommand('copy');}catch{}if(!ok&&navigator.clipboard)try{await navigator.clipboard.writeText(t.value);ok=true;}catch{}if(ok){t.remove();status.textContent='保存链接已复制。请打开手机自带浏览器，将链接粘贴到地址栏，再点“下载图片到手机”。';}else status.textContent='请长按下面的文字链接复制，再粘贴到手机自带浏览器的地址栏。';};
</script></body></html>
